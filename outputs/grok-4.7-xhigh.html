<!--
Unspecified choices (the brief left {{HAIR_COLOR}} unset and did not hex every material):
- Hair, outer ears, and tail: #a15c38 warm auburn, shared via CONFIG.hair.
- Extra colors live only in CONFIG: blush, mouth, nose, lashes, pupil, eye white,
  hoodie trim, pants cuffs, shoe upper, laces, outline, ground grid, ground tint, lights.
- Hood is down so the ears, blunt bangs, and shoulder-length hair stay visible.
- p = 0 is right-foot touchdown. The left foot is half a cycle later.
  Each foot is planted for 30% of the cycle, so both feet are in the air between steps.
  Ground travel is 1.4667 units per cycle, equal to the planted foot's backward speed.
- Ankle paths are 7-harmonic Fourier series (sin/cos of 2π·n·p only). Knees are
  solved with 2-bone IK. Elbows stay near 90°. Head world rotation is held upright
  with a small nod, and stacked joint offsets remove most of the torso bob.
- r160 lights are physical (legacy mode warns), so intensities are scaled by π.
  Directional light sits at (3.4, 6.8, 4.2), 2048 PCF soft shadow, normalBias 0.02.
  Camera near 0.08, far 60. OrbitControls damping is on. The ground plane is 2 mm
  under y = 0 so the sole can rest on y = 0 without z-fighting.
- Phase readout in the overlay is there so the 0–9 jumps are visible.
-->

};

function series(coef, phi) {
  let v = coef.a0;
  for (let n = 0; n < coef.c.length; n++) {
    const w = (n + 1) * TAU * phi;
    v += coef.c[n] * Math.cos(w) + coef.s[n] * Math.sin(w);
  }
  return v;
}

function fract(v) {
  return v - Math.floor(v);
}

function bobOf(phase) {
  return -BOB_AMP * Math.cos(2 * TAU * (phase - BOB_AT));
}

function basic(hex) {

function outlined(geo, mat, hull) {
  const mesh = new THREE.Mesh(geo, mat);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  const shell = new THREE.Mesh(geo, outlineMat);
  shell.scale.setScalar(hull);
  shell.castShadow = false;
  shell.receiveShadow = false;
  shell.frustumCulled = false;
  mesh.add(shell);
  return mesh;
}

function boneMesh(radiusTop, radiusBot, length, mat, hull) {
  const geo = new THREE.CylinderGeometry(radiusTop, radiusBot, length, 12, 1);
  const mesh = outlined(geo, mat, hull);
  mesh.position.y = -length * 0.5;
  return mesh;
}

function addClump(parent, x, y, z, len, rTop, rBot, rx, ry, rz, lag, amp, hull) {
  const pivot = new THREE.Group();
  pivot.position.set(x, y, z);
  pivot.rotation.set(rx, ry, rz);
  const geo = new THREE.CylinderGeometry(rTop, rBot, len, 7, 1);
  const mesh = outlined(geo, hairMat, hull);
  mesh.position.y = -len * 0.5;
  pivot.add(mesh);
  pivot.userData.base = { x: rx, y: ry, z: rz };
  pivot.userData.lag = lag;
  pivot.userData.amp = amp;
  parent.add(pivot);
  if (lag > 0) hairLag.push(pivot);
  return pivot;
}

const _pq = new THREE.Quaternion();
const _qa = new THREE.Quaternion();
const _qb = new THREE.Quaternion();
const _euler = new THREE.Euler();
const _m4 = new THREE.Matrix4();
const _x = new THREE.Vector3();
const _y = new THREE.Vector3();
const _z = new THREE.Vector3();
const _hip = new THREE.Vector3();
const _ankle = new THREE.Vector3();
const _knee = new THREE.Vector3();
const _dir = new THREE.Vector3();
const _side = new THREE.Vector3();
const _pole = new THREE.Vector3();
const _target = new THREE.Vector3();
const _footW = new THREE.Vector3();

function setWorldQuaternion(obj, qWorld) {
  obj.parent.updateWorldMatrix(true, false);
  obj.parent.getWorldQuaternion(_pq);
  obj.quaternion.copy(_pq.invert()).multiply(qWorld);
}

function boneQuaternion(origin, dest, pole, out) {
  _dir.subVectors(dest, origin);
  const len = _dir.length();
  if (len < 1e-8) _dir.set(0, -1, 0);
  else _dir.multiplyScalar(1 / len);
  _y.copy(_dir).negate();
  _x.copy(pole);
  _x.addScaledVector(_y, -_x.dot(_y));
  if (_x.lengthSq() < 1e-8) {
    _x.set(0, 0, 1);
    _x.addScaledVector(_y, -_x.dot(_y));
  }
  _x.normalize();
  _z.crossVectors(_x, _y).normalize();
  _m4.makeBasis(_x, _y, _z);
  return out.setFromRotationMatrix(_m4);
}

function solveLeg(leg, target, footPitch) {
  leg.thigh.getWorldPosition(_hip);
  _dir.subVectors(target, _hip);
  let dist = _dir.length();
  if (dist < 1e-6) {
    _dir.set(0, -1, 0);
    dist = 1;
  } else {
    _dir.multiplyScalar(1 / dist);
  }
  const maxD = THIGH_L + SHIN_L - 1e-4;
  const minD = Math.abs(THIGH_L - SHIN_L) + 1e-4;
  const clamped = Math.min(maxD, Math.max(minD, dist));
  _ankle.copy(_hip).addScaledVector(_dir, clamped);
  const cosA = (clamped * clamped + THIGH_L * THIGH_L - SHIN_L * SHIN_L) / (2 * clamped * THIGH_L);
  const hipAng = Math.acos(THREE.MathUtils.clamp(cosA, -1, 1));
  pelvis.getWorldQuaternion(_pq);
  _pole.set(1, 0.2, 0).applyQuaternion(_pq);
  _side.copy(_pole).addScaledVector(_dir, -_pole.dot(_dir));
  if (_side.lengthSq() < 1e-8) {
    _side.set(0, 1, 0).addScaledVector(_dir, -_side.dot(_dir));
  }
  _side.normalize();
  _knee.copy(_hip).addScaledVector(_dir, Math.cos(hipAng) * THIGH_L).addScaledVector(_side, Math.sin(hipAng) * THIGH_L);
  boneQuaternion(_hip, _knee, _pole, _qa);
  setWorldQuaternion(leg.thigh, _qa);
  boneQuaternion(_knee, _ankle, _pole, _qa);
  setWorldQuaternion(leg.shin, _qa);
  _euler.set(0, 0, footPitch, 'XYZ');
  _qb.setFromEuler(_euler);
  setWorldQuaternion(leg.foot, _qb);
  leg.foot.getWorldPosition(_footW);
  return _footW.distanceTo(target);
}

let p = 0;
let cycleIndex = 0;
let playing = true;
let slow = false;

function applyPose(phase) {
  const bob = bobOf(phase);
  const yaw = -0.2 * Math.cos(TAU * phase);
  const roll = -0.07 * Math.cos(TAU * phase);
  const lean = -0.1 - 0.04 * Math.cos(2 * TAU * (phase - BOB_AT));
  const nod = -0.055 * Math.cos(2 * TAU * (phase - 0.08));

  pelvis.position.set(0.015 * Math.sin(2 * TAU * phase), HIP_Y + 0.04 + bob, -0.012 * Math.cos(TAU * phase));
  pelvis.rotation.set(roll, yaw, lean * 0.45);

  spine.position.y = 0.08 - bob * 0.12;
  spine.rotation.set(-roll * 0.35, -yaw * 1.2, lean * 0.7);
  chest.position.y = 0.13 - bob * 0.16;
  chest.rotation.set(-roll * 0.4, -yaw * 0.9, 0.02 * Math.sin(2 * TAU * phase));
  neck.position.y = 0.16 - bob * 0.12;
  neck.rotation.set(roll * 0.2, yaw * 0.35, 0.04);
  head.position.set(0.015, 0.09 - bob * 0.22, 0);

  const swing = Math.cos(TAU * phase);
  armL.shoulder.rotation.set(-0.28, 0, 0);
  armR.shoulder.rotation.set(0.28, 0, 0);
  armL.upper.rotation.set(0, 0, 0.15 + 0.78 * swing);
  armR.upper.rotation.set(0, 0, 0.15 - 0.78 * swing);
  armL.fore.rotation.set(0, 0, Math.PI / 2);
  armR.fore.rotation.set(0, 0, Math.PI / 2);
  armL.hand.rotation.set(0, 0, -0.2);
  armR.hand.rotation.set(0, 0, -0.2);

  for (let i = 0; i < TAIL_N; i++) {
    const lag = i * 0.42;
    const amp = 0.045 + i * 0.026;
    const baseZ = i === 0 ? -1.7 : (i > 8 ? -0.08 : 0.02);
    tailSegs[i].rotation.set(
      amp * 0.55 * Math.cos(2 * TAU * phase - lag * 1.15),
      amp * Math.sin(TAU * phase - lag),
      baseZ + amp * 0.45 * Math.sin(2 * TAU * phase - lag)
    );
  }

  _euler.set(0.025 * Math.sin(TAU * phase), -0.06 * Math.cos(TAU * phase), nod, 'XYZ');
  _qb.setFromEuler(_euler);
  setWorldQuaternion(head, _qb);

  const earLag = 0.9;
  const earBounce = 0.26 * Math.sin(2 * TAU * phase - earLag);
  const earFlop = 0.1 * Math.sin(2 * TAU * phase - earLag - 0.35);
  earL.rotation.x = earL.userData.baseX + earBounce;
  earR.rotation.x = earR.userData.baseX - earBounce;
  earL.rotation.z = earL.userData.baseZ + earFlop;
  earR.rotation.z = earR.userData.baseZ + earFlop;

  for (let i = 0; i < hairLag.length; i++) {
    const clump = hairLag[i];
    const base = clump.userData.base;
    const lag = clump.userData.lag;
    const amp = clump.userData.amp;
    clump.rotation.set(
      base.x + amp * 0.65 * Math.sin(2 * TAU * phase - lag),
      base.y + amp * 0.8 * Math.sin(TAU * phase - lag),
      base.z + amp * Math.sin(2 * TAU * phase - lag * 1.1)
    );
  }

  const rightPhi = phase;
  const leftPhi = fract(phase + 0.5);
  _target.set(series(GAIT_X, rightPhi), ANKLE + series(GAIT_Y, rightPhi), -0.08);
  const pitchR = 1.7 * series(GAIT_Y, rightPhi);
  solveLeg(legR, _target, pitchR);
  _target.set(series(GAIT_X, leftPhi), ANKLE + series(GAIT_Y, leftPhi), 0.08);
  const pitchL = 1.7 * series(GAIT_Y, leftPhi);
  solveLeg(legL, _target, pitchL);
}

function scrollGround() {
  const tiles = ((cycleIndex + p) * STRIDE) / TILE;
  groundTex.offset.x = tiles - Math.floor(tiles);
}

function resetCamera() {
  controls.enableDamping = false;
  controls.update();
  camera.position.copy(CAM_POS);
  controls.target.copy(CAM_TARGET);
  camera.zoom = 1;
  camera.updateProjectionMatrix();
  controls.update();
  controls.enableDamping = true;
}

const statusEl = document.getElementById('status');
function updateHud() {
  const mode = playing ? (slow ? 'slow 0.25×' : 'playing') : 'paused';
  statusEl.textContent = 'phase ' + p.toFixed(2) + ' · ' + mode;
}

window.addEventListener('keydown', (event) => {
  if (event.repeat) return;
  if (event.code === 'Space') {
    event.preventDefault();
    playing = !playing;
  } else if (event.code === 'KeyS') {
    event.preventDefault();
    slow = !slow;
  } else if (event.code === 'KeyR') {
    event.preventDefault();
    resetCamera();
  } else if (event.code >= 'Digit0' && event.code <= 'Digit9') {
    event.preventDefault();
    playing = false;
    p = (event.code.charCodeAt(5) - 48) / 10;
  } else if (event.code >= 'Numpad0' && event.code <= 'Numpad9') {
    event.preventDefault();
    playing = false;
    p = (event.code.charCodeAt(6) - 48) / 10;
  }
});

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
});

applyPose(0);
scrollGround();
updateHud();

const clock = new THREE.Clock();
function frame() {
  requestAnimationFrame(frame);
  const dt = Math.min(clock.getDelta(), 0.05);
  if (playing) {
    p += dt * ((slow ? 0.25 : 1) / CONFIG.cycleSeconds);
    if (p >= 1) {
      const steps = Math.floor(p);
      cycleIndex += steps;
      p -= steps;
    }
  }
  applyPose(p);
  scrollGround();
  controls.update();
  renderer.render(scene, camera);
  updateHud();
}
frame();
</script>
</body>
