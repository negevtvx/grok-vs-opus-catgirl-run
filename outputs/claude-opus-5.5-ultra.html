<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cat-Girl Run Cycle</title>
<link rel="icon" href="data:,">
<!--
  Procedural anime cat-girl run cycle. Single file, Three.js r160 only, no external assets.

  Choices I made where the brief left something open:
  - Hair colour: the brief had an unfilled "{{HAIR_COLOR}}" placeholder, so I used lavender #8e7cc3.
    It reads well against the grey hoodie, teal eyes and sky-blue background. Change it in CONFIG.colors.hair.
  - Gait: each foot is planted for 36 % of the cycle, which leaves two flight phases of about 14 %
    where both feet are off the ground. The left foot lands at p = 0.0 and the right foot at p = 0.5.
  - Speed: the planted toe moves 0.56 units per stance, so she runs at 2.22 units/s (a brisk jog for a 1.6-unit figure).
    One ground texture tile is exactly 1/3 of the distance covered per cycle, so the scroll offset is frac(3p).
  - Legs use analytic two-bone IK that follows ankle and foot-pitch targets. I shaped those targets by hand
    (contact, down, passing, up) and convert them once at start-up into 40-harmonic Fourier series.
    At run time every animated value is therefore built only from sin/cos(2π·n·p) with integer n.
  - Feet push off by rolling onto the toe (heel lift) instead of bending at a separate toe joint.
  - Body bob: ±0.02 units, lowest at p = 0.15 and 0.65, just after each contact.
  - Outlines: inverted hulls pushed out along smoothed normals in view space, 3–6.5 mm thick.
  - Toon ramp: 3 steps (39 % / 73 % / 100 %) with nearest filtering. The face uses a softer 3-step ramp
    (69 % / 86 % / 100 %) so the eyes never fall into a hard shadow band.
  - The hood is down and bunched on her back. Her hands poke partly out of oversized sleeves ("sleeve paws").
  - OrbitControls has no damping, so R returns the camera exactly to (4, 1.6, 5) looking at (0, 0.9, 0).
-->
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; }
  canvas { display: block; }
  #hud {
    position: fixed; top: 12px; left: 12px; padding: 10px 12px;
    font: 12px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif;
    color: #1d2433; background: rgba(255, 255, 255, 0.8); border-radius: 8px;
    box-shadow: 0 1px 4px rgba(0, 0, 0, 0.12); user-select: none; pointer-events: none;
  }
  #hud b { display: block; margin-bottom: 3px; font-size: 13px; }
  kbd {
    display: inline-block; min-width: 14px; padding: 0 4px; margin-right: 3px; text-align: center;
    font: 11px/16px ui-monospace, Consolas, monospace; background: #fff;
    border: 1px solid #b9c0cf; border-bottom-width: 2px; border-radius: 4px;
  }
  #status { margin-top: 6px; font: 11px/1.4 ui-monospace, Consolas, monospace; color: #4a5468; }
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
</head>
<body>
<div id="hud">
  <b>Cat-girl run cycle</b>
  <div><kbd>Space</kbd>pause / play</div>
  <div><kbd>S</kbd>toggle 0.25× slow motion</div>
  <div><kbd>0</kbd>–<kbd>9</kbd>pause at p = 0.0 … 0.9</div>
  <div><kbd>R</kbd>reset camera</div>
  <div>Drag to orbit, scroll to zoom</div>
  <div id="status"></div>
</div>
<script type="module">
const CONFIG = {
  cycleSeconds: 0.7,               // one full stride (left step + right step)
  colors: {
    hair:          '#8e7cc3',      // {{HAIR_COLOR}} was left unfilled → lavender
    innerEar:      '#ffb3c6',
    iris:          '#2ec4b6',
    irisHighlight: '#ffffff',
    eyeWhite:      '#ffffff',
    lash:          '#2a1c33',
    skin:          '#ffe0cc',
    blush:         '#ff8fab',
    mouth:         '#8c2f45',
    tongue:        '#ff8c9e',
    hoodie:        '#e8e8f0',
    hoodiePocket:  '#d9d9e6',
    drawstring:    '#ffffff',
    pants:         '#2b3a67',
    pantsStripe:   '#ffffff',
    shoe:          '#ffffff',
    shoeLace:      '#c9cedb',
    sole:          '#e0443e',
    outline:       '#000000',
    background:    '#cfe8ff',
    ground:        '#9fd98b',
    groundStripe:  '#93d07e',
    groundLine:    '#86c371',
    skyLight:      '#ffffff',
    groundLight:   '#9cc48f',
    sunLight:      '#fff6ea',
  },
};

import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { mergeVertices } from 'three/addons/utils/BufferGeometryUtils.js';

const TAU = Math.PI * 2;
const COL = CONFIG.colors;
const V2 = THREE.Vector2, V3 = THREE.Vector3;

// ─────────────────────────────────────────────────────────────────────────────
// Gait parameters (units: scene units, radians; phase φ = 0 at touchdown)
// ─────────────────────────────────────────────────────────────────────────────
const GAIT = {
  duty: 0.36,          // fraction of the cycle a foot is planted  (< 0.5 → flight phases)
  stride: 0.56,        // distance the planted toe travels under the body during one stance
  contactX: 0.305,     // toe contact point ahead of the pelvis at touchdown
  toeX: 0.135,         // ankle → toe-roll point, horizontal
  ankleH: 0.07,        // ankle height above the sole
  heelLift: 0.4,       // fraction of stance at which the heel starts to peel off
  pushPitch: -0.7,     // foot pitch at toe-off (negative = toes down)
  swingLift: 0.27,     // extra ankle height during swing (heel kick)
  swingDorsi: 0.2,     // toes-up before touchdown
  hipH: 0.75,          // mean hip-joint height
  bob: 0.02,           // vertical bob amplitude
  bobLow: 0.15,        // phase of the lowest point (just after left contact; +0.5 for right)
  footZ: 0.075,        // lateral foot placement
};
const LEG = { thigh: 0.37, shin: 0.36 };
const SPEED = GAIT.stride / (GAIT.duty * CONFIG.cycleSeconds);  // planted-foot speed = ground speed
const TRAVEL = SPEED * CONFIG.cycleSeconds;                      // ground travel per cycle
const TILES_PER_CYCLE = 3;
const TILE = TRAVEL / TILES_PER_CYCLE;                           // ground texture tile size

// ─────────────────────────────────────────────────────────────────────────────
// Renderer, scene, camera, lights
// ─────────────────────────────────────────────────────────────────────────────
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.style.background = COL.background;
document.body.appendChild(renderer.domElement);
const maxAniso = renderer.capabilities.getMaxAnisotropy();

const scene = new THREE.Scene();
scene.background = new THREE.Color(COL.background);
scene.fog = new THREE.Fog(COL.background, 14, 42);

const camera = new THREE.PerspectiveCamera(35, window.innerWidth / window.innerHeight, 0.05, 200);
camera.position.set(4, 1.6, 5);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.9, 0);
controls.enableDamping = false;
controls.update();
controls.saveState();

scene.add(new THREE.HemisphereLight(COL.skyLight, COL.groundLight, 1.25));
const sun = new THREE.DirectionalLight(COL.sunLight, 2.1);
sun.position.set(3.5, 6, 4);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -2.5, right: 2.5, top: 2.5, bottom: -2.5, near: 0.5, far: 20 });
sun.shadow.camera.updateProjectionMatrix();
sun.shadow.bias = -0.0004;
sun.shadow.normalBias = 0.02;
scene.add(sun);

// ─────────────────────────────────────────────────────────────────────────────
// Materials: 3-step toon ramp + inverted-hull outlines
// ─────────────────────────────────────────────────────────────────────────────
const gradientMap = new THREE.DataTexture(new Uint8Array([100, 185, 255]), 3, 1, THREE.RedFormat);
gradientMap.minFilter = gradientMap.magFilter = THREE.NearestFilter;
gradientMap.generateMipmaps = false;
gradientMap.needsUpdate = true;
// softer ramp for the face so the eyes never fall into a hard shadow band
const faceGradientMap = new THREE.DataTexture(new Uint8Array([175, 220, 255]), 3, 1, THREE.RedFormat);
faceGradientMap.minFilter = faceGradientMap.magFilter = THREE.NearestFilter;
faceGradientMap.generateMipmaps = false;
faceGradientMap.needsUpdate = true;

const toon = (color, extra = {}) => new THREE.MeshToonMaterial({ color, gradientMap, ...extra });
const MAT = {
  hair: toon(COL.hair), innerEar: toon(COL.innerEar), skin: toon(COL.skin),
  hoodie: toon(COL.hoodie), pocket: toon(COL.hoodiePocket), string: toon(COL.drawstring),
  pants: toon(COL.pants), stripe: toon(COL.pantsStripe),
  shoe: toon(COL.shoe), lace: toon(COL.shoeLace), sole: toon(COL.sole),
};

const outlineMats = new Map();
function outlineMaterial(thickness) {
  if (!outlineMats.has(thickness)) {
    outlineMats.set(thickness, new THREE.ShaderMaterial({
      uniforms: { thickness: { value: thickness }, color: { value: new THREE.Color(COL.outline) } },
      vertexShader: /* glsl */`
        uniform float thickness;
        void main() {
          vec3 n = normalize(normalMatrix * normal);
          vec4 mv = modelViewMatrix * vec4(position, 1.0);
          mv.xyz += n * thickness;               // push along the view-space normal: constant width
          gl_Position = projectionMatrix * mv;
        }`,
      fragmentShader: /* glsl */`
        uniform vec3 color;
        void main() { gl_FragColor = vec4(color, 1.0); }`,
      side: THREE.BackSide,
    }));
  }
  return outlineMats.get(thickness);
}

// Welded copy with smooth normals, so hulls do not crack at hard edges and seams.
const smoothCache = new WeakMap();
function smoothGeo(geo) {
  let g = smoothCache.get(geo);
  if (!g) {
    g = geo.clone();
    for (const name of Object.keys(g.attributes)) if (name !== 'position') g.deleteAttribute(name);
    g = mergeVertices(g, 1e-4);
    g.computeVertexNormals();
    smoothCache.set(geo, g);
  }
  return g;
}

function part(geo, material, parent, { pos, rot, scale, outline = 0.0065, shadow = true } = {}) {
  const mesh = new THREE.Mesh(geo, material);
  if (pos) mesh.position.set(pos[0], pos[1], pos[2]);
  if (rot) mesh.rotation.set(rot[0], rot[1], rot[2]);
  if (scale) mesh.scale.set(scale[0], scale[1], scale[2]);
  mesh.castShadow = shadow;
  parent.add(mesh);
  if (outline > 0) mesh.add(new THREE.Mesh(smoothGeo(geo), outlineMaterial(outline)));
  return mesh;
}

function joint(parent, x = 0, y = 0, z = 0, name = '') {
  const g = new THREE.Group();
  g.position.set(x, y, z);
  g.name = name;
  parent.add(g);
  return g;
}

// ─────────────────────────────────────────────────────────────────────────────
// Geometry helpers
// ─────────────────────────────────────────────────────────────────────────────
// Tapered capsule that hangs from its pivot along −Y (radius r0 at the pivot, r1 at the far end).
function limbGeo(r0, r1, len, radial = 20) {
  const pts = [], n = 8;
  for (let i = 0; i <= n; i++) { const a = -Math.PI / 2 + (i / n) * Math.PI / 2; pts.push(new V2(Math.max(1e-4, Math.cos(a) * r1), -len + Math.sin(a) * r1)); }
  for (let i = 0; i <= n; i++) { const a = (i / n) * Math.PI / 2; pts.push(new V2(Math.max(1e-4, Math.cos(a) * r0), Math.sin(a) * r0)); }
  return new THREE.LatheGeometry(pts, radial);
}
const latheGeo = (profile, radial = 32, phiStart = 0, phiLength = TAU) =>
  new THREE.LatheGeometry(profile.map(([r, y]) => new V2(r, y)), radial, phiStart, phiLength);

// Hair clump: a closed tube along a spline with an elliptical, tapering cross-section.
// Its width lies along the scalp; its thickness points away from the skull (or along a fixed binormal).
function strandGeo(points, { width, thick, center, binormal = null, seg = 22, ring = 10 }) {
  const curve = new THREE.CatmullRomCurve3(points, false, 'centripetal');
  const pos = [], index = [];
  const P = new V3(), T = new V3(), N = new V3(), B = new V3(), ref = new V3();
  for (let i = 0; i <= seg; i++) {
    const t = i / seg;
    curve.getPointAt(t, P);
    curve.getTangentAt(t, T);
    if (binormal) {
      B.copy(binormal).addScaledVector(T, -binormal.dot(T)).normalize();
      N.crossVectors(B, T).normalize();
    } else {
      ref.copy(center);
      if (P.y < center.y) ref.y = P.y;          // below the skull: push away from the vertical axis
      N.subVectors(P, ref);
      N.addScaledVector(T, -N.dot(T)).normalize();
      B.crossVectors(T, N).normalize();
    }
    const w = width(t) / 2, h = thick(t) / 2;
    for (let j = 0; j < ring; j++) {
      const a = (j / ring) * TAU, cw = Math.cos(a) * w, sh = Math.sin(a) * h;
      pos.push(P.x + B.x * cw + N.x * sh, P.y + B.y * cw + N.y * sh, P.z + B.z * cw + N.z * sh);
    }
  }
  const startC = pos.length / 3;
  curve.getPointAt(0, P); pos.push(P.x, P.y, P.z);
  curve.getPointAt(1, P); pos.push(P.x, P.y, P.z);
  for (let i = 0; i < seg; i++) {
    for (let j = 0; j < ring; j++) {
      const a = i * ring + j, b = (i + 1) * ring + j, c = i * ring + (j + 1) % ring, d = (i + 1) * ring + (j + 1) % ring;
      index.push(a, b, c, b, d, c);
    }
  }
  const last = seg * ring;
  for (let j = 0; j < ring; j++) {
    index.push(startC, j, (j + 1) % ring);
    index.push(startC + 1, last + (j + 1) % ring, last + j);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setIndex(index);
  g.computeVertexNormals();
  return g;
}
// width profile: a → m (at tm) → e, with the tail end eased by exponent k
const taper = (a, m, e, tm = 0.35, k = 1.3) => t =>
  t < tm ? a + (m - a) * (t / tm) : e + (m - e) * (1 - Math.pow((t - tm) / (1 - tm), k));

function extrudeGeo(shape, depth, bevel, bevelSize, segs = 3) {
  const g = new THREE.ExtrudeGeometry(shape, {
    depth, bevelEnabled: true, bevelThickness: bevel, bevelSize, bevelSegments: segs, curveSegments: 14,
  });
  g.translate(0, 0, -depth / 2);
  return smoothGeo(g);
}

// ─────────────────────────────────────────────────────────────────────────────
// Face texture: drawn in equirectangular space so it wraps the head sphere.
// u = φ/2π with the face centred at φ = π (+X), v = θ/π from the top of the head.
// ─────────────────────────────────────────────────────────────────────────────
const hexRgb = h => { const n = parseInt(h.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; };
const rgba = (h, a) => `rgba(${hexRgb(h).join(',')},${a})`;
const mixHex = (h1, h2, t) => { const a = hexRgb(h1), b = hexRgb(h2); return `rgb(${a.map((v, i) => Math.round(v + (b[i] - v) * t)).join(',')})`; };

function faceTexture() {
  const W = 2048, H = 1024, K = W / TAU;              // pixels per radian on both axes
  const cv = document.createElement('canvas');
  cv.width = W; cv.height = H;
  const g = cv.getContext('2d');
  const X = dAz => W / 2 + dAz * K;                     // +dAz → the character's left (viewer's right)
  const Y = th => th * K;
  g.fillStyle = COL.skin; g.fillRect(0, 0, W, H);
  g.lineCap = g.lineJoin = 'round';

  // blush
  for (const s of [-1, 1]) {
    const bx = X(s * 0.55), by = Y(1.86);
    g.save(); g.translate(bx, by); g.scale(1.5, 0.8);
    const rg = g.createRadialGradient(0, 0, 0, 0, 0, 42);
    rg.addColorStop(0, rgba(COL.blush, 0.75)); rg.addColorStop(0.55, rgba(COL.blush, 0.4)); rg.addColorStop(1, rgba(COL.blush, 0));
    g.fillStyle = rg; g.beginPath(); g.arc(0, 0, 42, 0, TAU); g.fill(); g.restore();
    g.strokeStyle = mixHex(COL.blush, COL.mouth, 0.25); g.lineWidth = 4;
    for (let k = -1; k <= 1; k++) { g.beginPath(); g.moveTo(bx + k * 19 - 5, by + 9); g.lineTo(bx + k * 19 + 6, by - 9); g.stroke(); }
  }

  // eyes
  const irisDark = mixHex(COL.iris, '#0b2530', 0.55), irisLight = mixHex(COL.iris, '#ffffff', 0.5);
  const pupil = mixHex(COL.iris, '#07141c', 0.82);
  for (const s of [-1, 1]) {
    const ex = X(s * 0.37), ey = Y(1.65);
    g.save(); g.translate(ex, ey); g.scale(s * 1.15, 1.15); // local +x = outer corner
    const white = new Path2D();
    white.moveTo(-40, -34);
    white.bezierCurveTo(-14, -54, 28, -56, 50, -36);
    white.bezierCurveTo(54, 2, 36, 48, 4, 50);
    white.bezierCurveTo(-28, 52, -46, 12, -40, -34);
    g.fillStyle = COL.eyeWhite; g.fill(white);
    g.save(); g.clip(white);
    const ig = g.createLinearGradient(0, -50, 0, 56);
    ig.addColorStop(0, irisDark); ig.addColorStop(0.45, COL.iris); ig.addColorStop(1, irisLight);
    g.fillStyle = ig; g.beginPath(); g.ellipse(3, 6, 36, 50, 0, 0, TAU); g.fill();
    g.strokeStyle = irisDark; g.lineWidth = 5; g.stroke();
    g.fillStyle = pupil; g.beginPath(); g.ellipse(3, 10, 16, 25, 0, 0, TAU); g.fill();
    g.fillStyle = 'rgba(30, 16, 50, 0.22)'; g.beginPath(); g.ellipse(6, -54, 72, 34, 0, 0, TAU); g.fill();
    g.restore();
    g.strokeStyle = COL.lash; g.lineWidth = 10;
    g.beginPath(); g.moveTo(-44, -30); g.bezierCurveTo(-16, -58, 30, -60, 54, -38); g.stroke();
    g.fillStyle = COL.lash; g.beginPath(); g.moveTo(38, -49); g.lineTo(70, -56); g.lineTo(55, -30); g.closePath(); g.fill();
    g.lineWidth = 4; g.beginPath(); g.moveTo(12, 50); g.quadraticCurveTo(36, 45, 46, 24); g.stroke();
    g.restore();
    g.fillStyle = COL.irisHighlight;                    // highlights: same light direction for both eyes
    g.beginPath(); g.ellipse(ex - 14, ey - 17, 13, 17, -0.35, 0, TAU); g.fill();
    g.beginPath(); g.arc(ex + 16, ey + 29, 7, 0, TAU); g.fill();
    g.beginPath(); g.arc(ex + 10, ey - 30, 4, 0, TAU); g.fill();
  }

  // nose
  g.fillStyle = mixHex(COL.skin, COL.mouth, 0.3);
  g.beginPath(); g.ellipse(X(0), Y(1.855), 4, 3, 0, 0, TAU); g.fill();

  // small open cat mouth ("ω")
  const mx = X(0), my = Y(1.99);
  const mouth = new Path2D();
  mouth.moveTo(mx - 13, my + 2); mouth.quadraticCurveTo(mx, my + 30, mx + 13, my + 2); mouth.quadraticCurveTo(mx, my + 9, mx - 13, my + 2);
  g.fillStyle = COL.mouth; g.fill(mouth);
  g.save(); g.clip(mouth); g.fillStyle = COL.tongue; g.beginPath(); g.ellipse(mx, my + 17, 8, 5, 0, 0, TAU); g.fill(); g.restore();
  g.strokeStyle = COL.mouth; g.lineWidth = 4.5;
  g.beginPath(); g.moveTo(mx - 22, my - 4); g.quadraticCurveTo(mx - 11, my + 9, mx, my - 1); g.quadraticCurveTo(mx + 11, my + 9, mx + 22, my - 4); g.stroke();

  const tex = new THREE.CanvasTexture(cv);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = maxAniso;
  return tex;
}

// Sphere with a narrower, slightly pointed jaw; keeps the SphereGeometry UVs for the face texture.
function headGeo(r) {
  const g = new THREE.SphereGeometry(r, 64, 48);
  const p = g.attributes.position, v = new V3();
  for (let i = 0; i < p.count; i++) {
    v.fromBufferAttribute(p, i);
    const jaw = Math.max(0, -v.y / r) ** 2, front = Math.max(0, v.x / r + 0.2);
    v.z *= 1 - 0.3 * jaw;
    v.x *= 1 - 0.08 * jaw;
    v.y *= 1 + 0.12 * jaw * front;
    p.setXYZ(i, v.x, v.y, v.z);
  }
  g.computeVertexNormals();
  return g;
}

// ─────────────────────────────────────────────────────────────────────────────
// Ground: scrolling stripes + grid lines
// ─────────────────────────────────────────────────────────────────────────────
function groundTexture() {
  const s = 256, cv = document.createElement('canvas');
  cv.width = cv.height = s;
  const g = cv.getContext('2d');
  g.fillStyle = COL.ground; g.fillRect(0, 0, s, s);
  g.fillStyle = COL.groundStripe; g.fillRect(0, 0, s / 2, s);
  g.fillStyle = COL.groundLine; g.fillRect(0, 0, 5, s); g.fillRect(0, 0, s, 4);
  const t = new THREE.CanvasTexture(cv);
  t.colorSpace = THREE.SRGBColorSpace;
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.anisotropy = maxAniso;
  return t;
}
const GROUND_SIZE = 80;
const groundTex = groundTexture();
groundTex.repeat.set(GROUND_SIZE / TILE, GROUND_SIZE / TILE);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(GROUND_SIZE, GROUND_SIZE), new THREE.MeshToonMaterial({ map: groundTex, gradientMap }));
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

// ─────────────────────────────────────────────────────────────────────────────
// Character rig. Faces +X, up is +Y, her left side is −Z.
// Convention: +rotation.z swings a hanging limb forward (+X), −rotation.z tips the torso forward.
// ─────────────────────────────────────────────────────────────────────────────
const SIDES = [-1, 1];                       // −1 = left, +1 = right
const root = joint(scene, 0, 0, 0, 'character');
const J = {};
J.pelvis = joint(root, 0, GAIT.hipH, 0, 'pelvis');
J.spine  = joint(J.pelvis, 0, 0.07, 0, 'spine');
J.chest  = joint(J.spine, 0, 0.15, 0, 'chest');
J.neck   = joint(J.chest, 0, 0.17, 0, 'neck');
J.head   = joint(J.neck, 0, 0.07, 0, 'head');
J.arms = SIDES.map(s => {
  const shoulder = joint(J.chest, -0.01, 0.12, s * 0.07, `shoulder${s < 0 ? 'L' : 'R'}`);
  const upper = joint(shoulder, 0, 0.005, s * 0.085, `upperArm${s < 0 ? 'L' : 'R'}`);
  const fore = joint(upper, 0, -0.23, 0, `forearm${s < 0 ? 'L' : 'R'}`);
  const hand = joint(fore, 0, -0.175, 0, `hand${s < 0 ? 'L' : 'R'}`);
  return { s, shoulder, upper, fore, hand };
});
J.legs = SIDES.map(s => {
  const thigh = joint(J.pelvis, 0, 0, s * 0.085, `thigh${s < 0 ? 'L' : 'R'}`);
  const shin = joint(thigh, 0, -LEG.thigh, 0, `shin${s < 0 ? 'L' : 'R'}`);
  const foot = joint(shin, 0, -LEG.shin, 0, `foot${s < 0 ? 'L' : 'R'}`);
  return { s, thigh, shin, foot };
});

const unitSphere = new THREE.SphereGeometry(1, 28, 18);

// Pelvis / track pants
part(unitSphere, MAT.pants, J.pelvis, { pos: [0, 0.03, 0], scale: [0.115, 0.1, 0.15] });

// Oversized hoodie body (one shell on the spine, so it shows the torso counter-rotation)
const HOODIE_DEPTH = 0.74;
part(latheGeo([
  [0.001, -0.075], [0.125, -0.075], [0.146, -0.07], [0.152, -0.058], [0.149, -0.046], [0.157, -0.035],
  [0.164, -0.005], [0.167, 0.05], [0.167, 0.11], [0.162, 0.17], [0.15, 0.22], [0.132, 0.255],
  [0.105, 0.285], [0.078, 0.305], [0.055, 0.318], [0.001, 0.325],
], 40), MAT.hoodie, J.spine, { scale: [HOODIE_DEPTH, 1, 1] });
// kangaroo pocket
part(latheGeo([[0.1625, -0.04], [0.172, -0.035], [0.1745, 0.0], [0.1735, 0.045], [0.166, 0.05]], 16, Math.PI / 2 - 0.55, 1.1),
  MAT.pocket, J.spine, { scale: [HOODIE_DEPTH, 1, 1], outline: 0 });
// hood (worn down, bunched on the back) + collar
part(unitSphere, MAT.hoodie, J.chest, { pos: [-0.1, 0.125, 0], rot: [0, 0, 0.35], scale: [0.068, 0.078, 0.128] });
part(new THREE.TorusGeometry(0.07, 0.024, 12, 36), MAT.hoodie, J.chest, { pos: [0.004, 0.168, 0], rot: [Math.PI / 2, 0, 0], outline: 0.005 });
// drawstrings (swing a little)
J.strings = SIDES.map(s => {
  const pv = joint(J.chest, 0.104, 0.155, s * 0.032);
  part(new THREE.CapsuleGeometry(0.0055, 0.075, 4, 8), MAT.string, pv, { pos: [0, -0.045, 0], outline: 0.003 });
  return pv;
});

// Arms: sleeves (hoodie) + hands (skin)
const upperSleeve = limbGeo(0.061, 0.053, 0.23);
const foreSleeve = latheGeo([
  [0.001, -0.2], [0.045, -0.2], [0.05, -0.194], [0.057, -0.18], [0.06, -0.15], [0.057, -0.09],
  [0.053, -0.03], [0.05, 0.0], [0.04, 0.03], [0.02, 0.047], [0.001, 0.052],
], 24);
for (const a of J.arms) {
  part(upperSleeve, MAT.hoodie, a.upper);
  part(foreSleeve, MAT.hoodie, a.fore);
  part(unitSphere, MAT.skin, a.hand, { pos: [0.004, -0.035, 0], scale: [0.031, 0.037, 0.03], outline: 0.004 });
  part(unitSphere, MAT.skin, a.hand, { pos: [0.02, -0.03, -a.s * 0.016], scale: [0.012, 0.018, 0.012], outline: 0.003 });
}

// Legs: track pants with side stripes + sneakers
const thighGeo = limbGeo(0.08, 0.06, LEG.thigh);
const shinGeo = latheGeo([
  [0.001, -0.36], [0.041, -0.36], [0.047, -0.35], [0.049, -0.33], [0.052, -0.305], [0.055, -0.22],
  [0.058, -0.1], [0.06, -0.02], [0.05, 0.03], [0.03, 0.055], [0.001, 0.062],
], 24);
const thighStripe = new THREE.CapsuleGeometry(0.008, 0.3, 4, 8);
const shinStripe = new THREE.CapsuleGeometry(0.007, 0.27, 4, 8);

const shoeShape = new THREE.Shape();              // side profile, inset by the bevel size (0.01)
shoeShape.moveTo(-0.05, -0.044);
shoeShape.bezierCurveTo(-0.057, -0.02, -0.054, 0.0, -0.043, 0.012);
shoeShape.quadraticCurveTo(-0.008, 0.0, 0.024, 0.018);
shoeShape.bezierCurveTo(0.055, 0.006, 0.09, -0.012, 0.118, -0.02);
shoeShape.quadraticCurveTo(0.148, -0.026, 0.142, -0.044);
shoeShape.lineTo(-0.05, -0.044);
const shoeGeo = extrudeGeo(shoeShape, 0.064, 0.014, 0.01, 4);

const soleShape = new THREE.Shape();              // flat to x≈0.13 (toe-roll point), then toe spring
soleShape.moveTo(-0.058, -0.065);
soleShape.lineTo(0.13, -0.065);
soleShape.quadraticCurveTo(0.157, -0.062, 0.157, -0.051);
soleShape.lineTo(-0.061, -0.051);
soleShape.quadraticCurveTo(-0.065, -0.058, -0.058, -0.065);
const soleGeo = extrudeGeo(soleShape, 0.08, 0.006, 0.005, 2);
const laceGeo = new THREE.CapsuleGeometry(0.0045, 0.048, 3, 8);

for (const l of J.legs) {
  part(thighGeo, MAT.pants, l.thigh);
  part(thighStripe, MAT.stripe, l.thigh, { pos: [0, -0.18, l.s * 0.069], rot: [l.s * 0.055, 0, 0], outline: 0 });
  part(shinGeo, MAT.pants, l.shin);
  part(shinStripe, MAT.stripe, l.shin, { pos: [0, -0.17, l.s * 0.055], rot: [l.s * 0.025, 0, 0], outline: 0 });
  part(shoeGeo, MAT.shoe, l.foot, { outline: 0.005 });
  part(soleGeo, MAT.sole, l.foot, { outline: 0.005 });
  [[0.045, 0.021], [0.07, 0.011], [0.095, 0.0]].forEach(([x, y]) =>
    part(laceGeo, MAT.lace, l.foot, { pos: [x, y, 0], rot: [Math.PI / 2, 0, 0], outline: 0 }));
}

// Neck + head
part(new THREE.CapsuleGeometry(0.034, 0.1, 4, 14), MAT.skin, J.neck, { pos: [0, 0.02, 0], outline: 0.005 });
const HEAD_R = 0.185;
const Hc = new V3(0, 0.17, 0);                   // skull centre in head-joint space
part(headGeo(HEAD_R), new THREE.MeshToonMaterial({ map: faceTexture(), gradientMap: faceGradientMap }), J.head, { pos: [Hc.x, Hc.y, Hc.z], outline: 0.006 });

// Hair ── az is measured from +X (front) toward +Z (her right); θ from the top of the head.
const sph = (th, az, r) => new V3(Math.sin(th) * Math.cos(az) * r, Math.cos(th) * r, Math.sin(th) * Math.sin(az) * r).add(Hc);
const hor = (az, r, y) => new V3(Math.cos(az) * r, y, Math.sin(az) * r).add(Hc);
function hairClump(points, pivotAt, opts, thickness = 0.005) {
  const pv = joint(J.head, pivotAt.x, pivotAt.y, pivotAt.z);
  const local = points.map(q => q.clone().sub(pivotAt));
  part(strandGeo(local, { ...opts, center: Hc.clone().sub(pivotAt) }), MAT.hair, pv, { outline: thickness });
  return pv;
}
part(new THREE.SphereGeometry(0.2, 48, 20, 0, TAU, 0, 1.32), MAT.hair, J.head, { pos: [Hc.x, Hc.y, Hc.z], outline: 0.005 });
part(new THREE.SphereGeometry(0.197, 48, 24, Math.PI + 0.95, TAU - 1.9, 0, 2.2), MAT.hair, J.head, { pos: [Hc.x, Hc.y, Hc.z], outline: 0.005 });

J.bangs = [];
for (let i = 0; i < 7; i++) {                     // blunt fringe: all clumps end on the same line
  const az = -0.82 + i * (1.64 / 6);
  const pts = [sph(0.22, az * 0.3, 0.194), sph(0.7, az * 0.78, 0.203), sph(1.12, az * 0.96, 0.208), sph(1.4, az, 0.205)];
  J.bangs.push(hairClump(pts, pts[0], { width: t => 0.045 + 0.035 * Math.min(1, t * 1.6), thick: t => 0.026 - 0.008 * t }));
}
J.sideLocks = SIDES.map(s => {
  const pts = [sph(0.4, s * 0.7, 0.196), sph(1.0, s * 1.05, 0.206), sph(1.55, s * 1.12, 0.21), sph(2.0, s * 1.1, 0.2), hor(s * 1.08, 0.175, -0.205)];
  return hairClump(pts, sph(1.3, s * 1.1, 0.205), { width: taper(0.05, 0.066, 0.01, 0.4, 1.4), thick: taper(0.022, 0.024, 0.006, 0.4) });
});
J.backHair = [];
for (let k = 0; k < 9; k++) {                     // shoulder-length back clumps, longest at the back
  const az = 1.3 + k * ((TAU - 2.6) / 8);
  const len = 0.24 + 0.08 * (0.5 - 0.5 * Math.cos(az));
  const pts = [sph(0.3, az, 0.193), sph(0.9, az, 0.21), sph(1.5, az, 0.215), sph(2.0, az, 0.208), hor(az, 0.195, -len + 0.07), hor(az, 0.216, -len)];
  J.backHair.push(hairClump(pts, sph(1.5, az, 0.205), { width: taper(0.07, 0.115, 0.018, 0.4, 1.6), thick: taper(0.02, 0.028, 0.007, 0.4) }));
}
const ahogePivot = sph(0.1, 0.4, 0.19);          // single antenna strand on top
J.ahoge = hairClump([sph(0.1, 0.4, 0.19), Hc.clone().add(new V3(0.012, 0.255, 0.004)), Hc.clone().add(new V3(0.06, 0.29, 0.012)), Hc.clone().add(new V3(0.105, 0.265, 0.018))],
  ahogePivot, { width: taper(0.024, 0.026, 0.003, 0.3), thick: taper(0.012, 0.012, 0.003, 0.3), binormal: new V3(0, 0, 1) }, 0.004);

// Cat ears (hair-coloured, pink inner ear). Thickness runs along X, so the pink side faces forward.
const earShape = new THREE.Shape();
earShape.moveTo(-0.048, 0.0);
earShape.quadraticCurveTo(-0.04, 0.07, 0.002, 0.118);
earShape.quadraticCurveTo(0.036, 0.065, 0.048, 0.0);
earShape.quadraticCurveTo(0.0, -0.016, -0.048, 0.0);
const innerShape = new THREE.Shape();
innerShape.moveTo(-0.028, 0.014);
innerShape.quadraticCurveTo(-0.022, 0.06, 0.002, 0.092);
innerShape.quadraticCurveTo(0.02, 0.055, 0.028, 0.014);
innerShape.quadraticCurveTo(0.0, 0.004, -0.028, 0.014);
const earGeo = extrudeGeo(earShape, 0.016, 0.01, 0.008).rotateY(Math.PI / 2);
const innerEarGeo = extrudeGeo(innerShape, 0.004, 0.003, 0.003, 2).rotateY(Math.PI / 2);
J.ears = SIDES.map(s => {
  const b = sph(0.64, s * 1.45, 0.19);
  const pv = joint(J.head, b.x - 0.01, b.y, b.z, `ear${s < 0 ? 'L' : 'R'}`);
  part(earGeo, MAT.hair, pv, { outline: 0.005 });
  part(innerEarGeo, MAT.innerEar, pv, { pos: [0.017, 0, 0], outline: 0 });
  return { s, pv };
});

// Tail: 12 chained, tapering segments from the lower back
const TAIL_N = 12, TAIL_SEG = 0.05;
J.tail = [];
{
  let parent = J.pelvis, at = [-0.1, 0.035, 0];
  for (let i = 0; i < TAIL_N; i++) {
    const seg = joint(parent, at[0], at[1], at[2], `tail${i}`);
    const r0 = 0.029 - 0.0014 * i, r1 = 0.029 - 0.0014 * (i + 1);
    part(limbGeo(r0, r1, TAIL_SEG, 14), MAT.hair, seg, { rot: [0, 0, Math.PI], outline: 0.005 });
    J.tail.push(seg);
    parent = seg; at = [0, TAIL_SEG, 0];
  }
}

// ─────────────────────────────────────────────────────────────────────────────
// Leg targets: shaped by hand, then turned into Fourier series in φ
// ─────────────────────────────────────────────────────────────────────────────
const smooth01 = t => { t = Math.min(1, Math.max(0, t)); return t * t * (3 - 2 * t); };
const hermite = (p0, m0, p1, m1, s) => {
  const s2 = s * s, s3 = s2 * s;
  return (2 * s3 - 3 * s2 + 1) * p0 + (s3 - 2 * s2 + s) * m0 + (-2 * s3 + 3 * s2) * p1 + (s3 - s2) * m1;
};
// Returns [ankle x relative to the pelvis, ankle height, foot pitch] for per-leg phase φ ∈ [0,1).
// STANCE φ∈[0,duty): CONTACT → DOWN (flat foot, knee absorbs) → heel peels off, toe pivots → UP / toe-off.
// SWING: heel kicks up behind, PASSING the stance leg, knee drives forward, foot retracts to touchdown.
function legKey(phi) {
  const G = GAIT, D = G.duty;
  phi -= Math.floor(phi);
  const ankleFromToe = (toeX, pitch) => {
    const c = Math.cos(pitch), s = Math.sin(pitch);
    return [toeX - G.toeX * c - G.ankleH * s, -G.toeX * s + G.ankleH * c];
  };
  if (phi < D) {
    const u = phi / D;
    const pitch = G.pushPitch * smooth01((u - G.heelLift) / (1 - G.heelLift));
    const [x, y] = ankleFromToe(G.contactX - G.stride * u, pitch);   // toe moves back at ground speed
    return [x, y, pitch];
  }
  const s = (phi - D) / (1 - D);
  const [x0, y0] = ankleFromToe(G.contactX - G.stride, G.pushPitch);
  const [x1, y1] = ankleFromToe(G.contactX, 0);
  const v = -G.stride / D * (1 - D);                                   // C¹ with the planted foot's speed
  return [
    hermite(x0, v, x1, v, s),
    hermite(y0, 0, y1, 0, s) + G.swingLift * s * s * (1 - s) ** 3 / 0.03456,
    hermite(G.pushPitch, 0, 0, 0, s) + G.swingDorsi * s ** 6 * (1 - s) ** 2 / 0.011124,
  ];
}
// Truncated Fourier series of a 1-periodic function: f(p) = a0 + Σ aₙcos(2πnp) + bₙsin(2πnp).
function fourierSeries(fn, harmonics = 40, samples = 1024) {
  const a = new Float64Array(harmonics + 1), b = new Float64Array(harmonics + 1);
  for (let k = 0; k < samples; k++) {
    const t = k / samples, v = fn(t);
    for (let n = 0; n <= harmonics; n++) { a[n] += v * Math.cos(TAU * n * t); b[n] += v * Math.sin(TAU * n * t); }
  }
  a[0] /= samples;
  for (let n = 1; n <= harmonics; n++) { a[n] *= 2 / samples; b[n] *= 2 / samples; }
  return p => {
    let v = a[0];
    for (let n = 1; n <= harmonics; n++) v += a[n] * Math.cos(TAU * n * p) + b[n] * Math.sin(TAU * n * p);
    return v;
  };
}
const LEG_X = fourierSeries(phi => legKey(phi)[0]);
const LEG_Y = fourierSeries(phi => legKey(phi)[1]);
const LEG_PITCH = fourierSeries(phi => legKey(phi)[2]);

// Analytic two-bone IK: thigh abduction (X) and flexion (Z), knee flexion (Z); the foot is world-aligned.
const _inv = new THREE.Matrix4(), _d = new V3(), _q = new THREE.Quaternion(), _qp = new THREE.Quaternion(), _e = new THREE.Euler();
const clamp = THREE.MathUtils.clamp;
function solveLeg(leg, ankleWorld, pitch) {
  const L1 = LEG.thigh, L2 = LEG.shin;
  _d.copy(ankleWorld).applyMatrix4(_inv).sub(leg.thigh.position);    // hip → ankle in pelvis space
  const ax = Math.atan2(-_d.z, -_d.y);
  const tx = _d.x, ty = -Math.hypot(_d.y, _d.z);
  const r = clamp(Math.hypot(tx, ty), Math.abs(L1 - L2) + 1e-3, (L1 + L2) * 0.9995);
  const A = Math.acos(clamp((L1 * L1 + r * r - L2 * L2) / (2 * L1 * r), -1, 1));
  const K = Math.acos(clamp((L1 * L1 + L2 * L2 - r * r) / (2 * L1 * L2), -1, 1));
  leg.thigh.rotation.set(ax, 0, Math.atan2(tx, -ty) + A);            // knee forward of the hip→ankle line
  leg.shin.rotation.set(0, 0, -(Math.PI - K));
  leg.shin.updateWorldMatrix(true, false);
  leg.shin.getWorldQuaternion(_q).invert();
  leg.foot.quaternion.copy(_q).multiply(_qp.setFromEuler(_e.set(0, 0, pitch)));
}

// ─────────────────────────────────────────────────────────────────────────────
// Pose: every value is built from cos/sin(2π·n·(p − phase)) with integer n
// ─────────────────────────────────────────────────────────────────────────────
const _ankle = new V3();
function applyPose(p) {
  const C = (n, ph, lag = 0) => Math.cos(TAU * n * (p - ph) - lag);
  const S = (n, ph, lag = 0) => Math.sin(TAU * n * (p - ph) - lag);

  // hips: bob twice per cycle (lowest just after each contact), yaw with the forward thigh, roll toward the swing side
  const bob = -GAIT.bob * C(2, GAIT.bobLow);
  const yaw = -0.13 * C(1, 0.9);
  const roll = 0.075 * C(1, 0.18);
  J.pelvis.position.set(0, GAIT.hipH + bob, -0.012 * C(1, 0.18));
  J.pelvis.rotation.set(roll, yaw, 0);

  // torso counter-rotates against the hips and leans forward
  J.spine.rotation.set(-0.7 * roll, -1.35 * yaw, -0.13 - 0.025 * C(2, 0.2));
  J.chest.rotation.set(-0.15 * roll, -0.25 * yaw, -0.06 - 0.012 * C(2, 0.22));

  // head: cancel most of the torso motion and bob, then add a small nod
  J.neck.position.y = 0.17 - 0.6 * bob;
  J.neck.rotation.set(-0.08 * roll, 0.3 * yaw, 0.09 + 0.018 * C(2, 0.2));
  J.head.rotation.set(-0.06 * roll, 0.24 * yaw, 0.09 + 0.019 * C(2, 0.2) - 0.03 * C(2, 0.26));

  // arms: opposite to the legs, elbows ≈ 90°
  for (const a of J.arms) {
    const ph = a.s < 0 ? 0.4 : 0.9;              // left arm leads when the right thigh is forward
    const sw = C(1, ph);
    a.shoulder.rotation.set(-a.s * 0.02 * C(2, 0.2), a.s * 0.09 * sw, 0);
    a.upper.rotation.set(-a.s * 0.2, a.s * 0.35, 0.1 + 0.62 * sw);
    a.fore.rotation.set(0, 0, 1.5 + 0.22 * C(1, ph + 0.04));
    a.hand.rotation.set(0, 0, -0.1 + 0.12 * C(1, ph + 0.1));
  }

  // legs: IK onto the Fourier-series targets (right leg is half a cycle behind the left)
  J.pelvis.updateWorldMatrix(true, false);
  _inv.copy(J.pelvis.matrixWorld).invert();
  for (const l of J.legs) {
    const phi = p + (l.s < 0 ? 0 : 0.5);
    solveLeg(l, _ankle.set(LEG_X(phi), LEG_Y(phi), l.s * GAIT.footZ), LEG_PITCH(phi));
  }

  // ears: slight bounce, delayed after the bob
  for (const e of J.ears) {
    e.pv.rotation.set(e.s * (0.42 + 0.07 * C(2, 0.25)), 0, -0.12 + 0.06 * C(2, 0.3) + 0.03 * e.s * S(1, 0.95));
  }

  // tail: phase delay and amplitude grow toward the tip (follow-through), driven by the bob and hip sway
  J.tail.forEach((seg, i) => {
    const k = i / (TAIL_N - 1);
    const vert = (0.03 + 0.07 * k) * C(2, GAIT.bobLow, 0.9 + 0.55 * i);
    const lat = (0.03 + 0.09 * k) * S(1, 0.9, 0.6 + 0.45 * i);
    if (i === 0) seg.rotation.set(0, lat, 1.95 + vert);
    else seg.rotation.set(lat, 0, -0.125 + vert);
  });

  // hair: back clumps trail and lag behind the head
  J.backHair.forEach((h, k) => h.rotation.set(0.035 * S(1, 0.9, 1.1 + 0.12 * k), 0, -0.07 + 0.045 * C(2, GAIT.bobLow, 1.3 + 0.1 * k)));
  J.sideLocks.forEach(h => h.rotation.set(0.02 * S(1, 0.9, 1.0), 0, -0.03 + 0.03 * C(2, GAIT.bobLow, 1.2)));
  J.bangs.forEach((h, k) => h.rotation.set(0, 0, 0.012 * C(2, GAIT.bobLow, 1.0 + 0.1 * k)));
  J.ahoge.rotation.set(0.05 * S(1, 0.9, 1.2), 0, 0.12 * C(2, GAIT.bobLow, 1.4));
  J.strings.forEach((h, k) => h.rotation.set(0.1 * S(1, 0.9, 0.8 + 0.3 * k), 0, 0.15 + 0.12 * C(2, GAIT.bobLow, 1.0)));

  // ground scrolls toward −X at exactly the planted-foot speed
  groundTex.offset.x = (TILES_PER_CYCLE * p) % 1;
}

// ─────────────────────────────────────────────────────────────────────────────
// Controls, loop, resize
// ─────────────────────────────────────────────────────────────────────────────
let phase = 0, paused = false, slow = false;
const statusEl = document.getElementById('status');

window.addEventListener('keydown', e => {
  if (e.code === 'Space') { e.preventDefault(); if (!e.repeat) paused = !paused; }
  else if (e.code === 'KeyS') { if (!e.repeat) slow = !slow; }
  else if (e.code === 'KeyR') controls.reset();
  else if (/^[0-9]$/.test(e.key)) { paused = true; phase = Number(e.key) / 10; }
});

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
});

let last = performance.now();
renderer.setAnimationLoop(() => {
  const now = performance.now();
  const dt = Math.min(0.1, (now - last) / 1000);
  last = now;
  if (!paused) phase = (phase + dt * (slow ? 0.25 : 1) / CONFIG.cycleSeconds) % 1;
  applyPose(phase);
  statusEl.textContent = `p = ${phase.toFixed(3)} · ${paused ? 'paused' : 'playing'} · ${slow ? '0.25×' : '1×'}`;
  renderer.render(scene, camera);
});
</script>
